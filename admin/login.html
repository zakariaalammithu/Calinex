<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CALINEX Management Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(235, 254, 91, 0.05), transparent 40%),
                  #0a0a0c;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }
    .password-input-wrap {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .forgot-link {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .auth-alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }
    .auth-alert.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .auth-alert.success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .btn-auth-submit {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      justify-content: center;
    }
    .auth-footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>

<!-- APPROVED ALINEX LOGO STYLES -->

  max-width: fit-content !important;

    width: 34px !important;

</style>

<link rel="stylesheet" href="../css/book-call-modal.css">
<!-- APPROVED CALINEX FAVICON -->
<link rel="icon" type="image/svg+xml" href="../images/calinex-c-dark.svg">
<link rel="shortcut icon" type="image/x-icon" href="../images/calinex-c-dark.svg">
<link rel="apple-touch-icon" href="../images/calinex-c-dark.svg">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">CALINEX <span class="brand-badge">ADMIN</span></div>
        <p class="auth-subtitle">Sign in to manage content, leads & agency operations</p>
      </div>

      <div id="authAlert" class="auth-alert error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="hello@calinex.us" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" required>
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe"> Remember me (30 days)
          </label>
          <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary btn-auth-submit">
          <span id="btnText">Sign In to Dashboard</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        Protected by CALINEX Enterprise Security &bull; Session Verification Active
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="admin-modal-backdrop">
    <div class="admin-modal" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button type="button" class="modal-close-btn" id="closeForgotModal">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 16px;">
          Enter your admin email address to request a secure password reset token.
        </p>
        <div id="forgotAlert" class="auth-alert"></div>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" class="form-input" placeholder="hello@calinex.us">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelForgotBtn">Cancel</button>
        <button type="button" class="btn-primary" id="sendForgotBtn">Send Instructions</button>
      </div>
    </div>
  </div>

  <script>
    // Toggle Password Visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('loginPassword');
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
    });

    // Alert helper
    const authAlert = document.getElementById('authAlert');
    function showAlert(msg, isError = true) {
      authAlert.textContent = msg;
      authAlert.className = isError ? 'auth-alert error' : 'auth-alert success';
      authAlert.style.display = 'block';
    }

    // Handle Login Submit
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authAlert.style.display = 'none';

      const email = document.getElementById('loginEmail').value.trim();
      const password = passwordInput.value;
      const remember = document.getElementById('rememberMe').checked;

      btnText.textContent = 'Authenticating...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Login successful! Redirecting...', false);
          // Store token in localStorage as backup for API headers
          if (data.token) localStorage.setItem('calinex_admin_token', data.token);
          setTimeout(() => {
            window.location.href = '/admin/dashboard';
          }, 400);
        } else {
          showAlert(data.error || 'Invalid credentials. Please try again.', true);
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In to Dashboard';
        }
      } catch (err) {
        showAlert('Network or server connection error. Please try again.', true);
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
      }
    });

    // Forgot Password Modal
    const forgotModal = document.getElementById('forgotModal');
    const forgotBtn = document.getElementById('forgotPasswordBtn');
    const closeForgot = document.getElementById('closeForgotModal');
    const cancelForgot = document.getElementById('cancelForgotBtn');
    const sendForgot = document.getElementById('sendForgotBtn');
    const forgotEmail = document.getElementById('forgotEmail');
    const forgotAlert = document.getElementById('forgotAlert');

    forgotBtn.addEventListener('click', (e) => {
      e.preventDefault();
      forgotModal.classList.add('open');
      forgotEmail.value = document.getElementById('loginEmail').value;
      forgotAlert.style.display = 'none';
    });

    function closeForgotDialog() {
      forgotModal.classList.remove('open');
    }
    closeForgot.addEventListener('click', closeForgotDialog);
    cancelForgot.addEventListener('click', closeForgotDialog);

    sendForgot.addEventListener('click', async () => {
      const email = forgotEmail.value.trim();
      if (!email) return;
      sendForgot.disabled = true;
      sendForgot.textContent = 'Processing...';

      try {
        const res = await fetch('/api/admin/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        forgotAlert.textContent = data.message || 'Password reset link sent.';
        forgotAlert.className = 'auth-alert success';
        forgotAlert.style.display = 'block';
      } catch (e) {
        forgotAlert.textContent = 'Failed to process request.';
        forgotAlert.className = 'auth-alert error';
        forgotAlert.style.display = 'block';
      } finally {
        sendForgot.disabled = false;
        sendForgot.textContent = 'Send Instructions';
      }
    });
  </script>
<script src="../js/book-call-modal.js"></script>
</body>
</html>
