  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #181824 0%, #09090c 70%);
      padding: 20px;
    }
    .login-box {
      background: #121217;
      border: 1px solid #20202a;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 10px;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--admin-text-muted);
      margin-top: 4px;
    }
    .login-alert {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
    }
    .login-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .credentials-hint {
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      background: #181820;
      border: 1px dashed #30303e;
      font-size: 0.8125rem;
      color: #a1a1aa;
      line-height: 1.5;
    }
  </style>

<body class="admin-body login-page">
  <div class="login-box">
    <div class="login-brand">
      <img src="images/calinex-logo.svg" alt="CALINEX" style="height: 32px; filter: brightness(0) invert(1);" />
      <h1 class="login-title">Control Center</h1>
      <p class="login-subtitle">Sign in to manage leads, APIs, and website settings</p>
    </div>

    <div id="loginAlert" class="login-alert"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" class="form-input-admin" value="hello@calinex.us" required autocomplete="email"/>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-input-admin" placeholder="••••••••••••" required autocomplete="current-password"/>
      </div>

      <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 8px;" id="loginSubmitBtn">
        Sign In to Dashboard
      </button>
    </form>

    
  </div>

  <script>
    const token = localStorage.getItem('calinex_admin_token');
    if (token) {
      // Check if existing token is valid
      fetch('/api/admin/dashboard/stats', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => {
        if (res.ok) window.location.href = '/admin';
      });
    }

    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('loginSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      alertBox.className = 'login-alert';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('calinex_admin_token', data.token);
          localStorage.setItem('calinex_admin_email', data.email);
          window.location.href = '/admin';
        } else {
          alertBox.textContent = data.message || 'Invalid credentials. Please check your password.';
          alertBox.className = 'login-alert error';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Server connection error. Please try again.';
        alertBox.className = 'login-alert error';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
